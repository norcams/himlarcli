---
# r1 flavor used for vGPU NVIDIA RTX PRO 6000 MIG profile with 96GB GPU-memory 
# for GEOWOLF in bgo region
public: false
properties:
  hw_rng:allowed: 'True'
  hw_rng:rate_bytes: 1000000
  hw_rng:rate_period: 60
  resources:VGPU: '1'
  trait:CUSTOM_NREC_VGPU_RTX_96G: 'required'
gr1.rtx6k.96g:
  'gr1.rtx6k.96g.8xlarge': ## Split everything in four
    vcpus: 32
    ram: 96256
    disk: 3500